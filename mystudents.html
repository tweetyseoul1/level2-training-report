<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>내 수강생 신청 현황</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css" />
<style>
  :root {
    --bg: #F3F1EA; --card: #FFFFFF; --ink: #1C1B16; --ink-soft: #5C5A50; --ink-faint: #8E8B7D;
    --line: #E4E0D2; --line-strong: #C7C2AE; --accent: #1E4E52; --accent-hover: #163B3E;
    --accent-ink: #123336; --accent-bg: #DEEAE7; --danger-ink: #A23B2E;
    --shadow-card: 0 1px 2px rgba(28,27,22,0.05), 0 16px 32px -18px rgba(28,27,22,0.28);
    --font-serif: Georgia, "Iowan Old Style", "Nanum Myeongjo", serif;
    --font-sans: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171815; --card: #212220; --ink: #F1EEE4; --ink-soft: #B2AE9E; --ink-faint: #7A7669;
      --line: #34352F; --line-strong: #47483F; --accent: #79BAB9; --accent-hover: #91CBCA;
      --accent-ink: #CFEBEA; --accent-bg: #223533; --danger-ink: #E68B7C;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); padding: 48px 20px 64px; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 900px; margin: 0 auto; font-family: var(--font-sans); color: var(--ink); }
  .eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; letter-spacing: .06em;
    color: var(--accent-ink); background: var(--accent-bg); padding: 5px 12px 5px 10px; border-radius: 100px; font-weight: 600; }
  h1 { font-family: var(--font-serif); font-size: 26px; font-weight: 400; margin: 16px 0 8px; }
  .lead { font-size: 14.5px; line-height: 1.65; color: var(--ink-soft); margin: 0 0 4px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px 26px; box-shadow: var(--shadow-card); }
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .count-pill { font-size: 12.5px; color: var(--ink-faint); }
  button.btn { padding: 9px 15px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--ink);
    font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; margin-left: auto; }
  button.btn:hover { border-color: var(--accent); }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
  th, td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; }
  th { background: var(--accent-bg); color: var(--accent-ink); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  .empty-state { padding: 30px; text-align: center; color: var(--ink-faint); font-size: 13.5px; }
  .error-state { padding: 30px; text-align: center; color: var(--danger-ink); font-size: 14px; }
  .foot { text-align: center; font-size: 11.5px; color: var(--ink-faint); margin: 22px 0 4px; }
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow"><i class="ti ti-clipboard-list" aria-hidden="true"></i>한국영유아AI교육진흥협회</span>
  <h1 id="page-title">내 수강생 신청 현황</h1>
  <p class="lead" id="page-lead">이 링크로 신청하신 수강생 명단만 확인하실 수 있습니다.</p>

  <div class="card">
    <div class="toolbar">
      <span class="count-pill" id="count-pill"></span>
      <button class="btn" id="refresh-btn"><i class="ti ti-refresh" aria-hidden="true"></i> 새로고침</button>
    </div>
    <div class="table-wrap" id="table-area">
      <table id="students-table">
        <thead>
          <tr>
            <th>접수일시</th><th>구분</th><th>자격/과정명</th><th>성명</th><th>생년월일</th>
            <th>연락처</th><th>이메일</th><th>우편주소</th><th>입금자명</th><th>입금일자</th><th>비고</th>
          </tr>
        </thead>
        <tbody id="students-table-body"></tbody>
      </table>
      <div class="empty-state" id="students-empty" style="display:none;">아직 신청 내역이 없습니다.</div>
      <div class="error-state" id="students-error" style="display:none;">링크가 올바르지 않습니다. 관리자에게 문의해주세요.</div>
    </div>
  </div>

  <p class="foot">문의 010-3005-3473</p>
</div>

<script>
  var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbziBjHN94C-_5Gg2RZ0pFazuSWEF9mzOGZHdvOSeejsTY34M1gjpE_9qTI9NpDn6IhC/exec';
  var teacherName = new URLSearchParams(window.location.search).get('teacher') || '';

  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

  function load() {
    if (!teacherName) {
      document.getElementById('table-area').style.display = 'none';
      document.getElementById('students-error').style.display = 'block';
      return;
    }
    document.getElementById('page-title').textContent = teacherName + ' 강사님 수강생 신청 현황';
    document.getElementById('page-lead').textContent = teacherName + ' 강사님 앞으로 신청된 수강생 명단만 표시됩니다.';

    fetch(WEBAPP_URL + '?action=teacherStudents&teacher=' + encodeURIComponent(teacherName))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var rows = (data && data.ok && data.students) || [];
        var tbody = document.getElementById('students-table-body');
        tbody.innerHTML = '';
        document.getElementById('students-empty').style.display = rows.length ? 'none' : 'block';
        document.getElementById('count-pill').textContent = rows.length + '건';
        rows.slice().reverse().forEach(function (s) {
          var ts = s['타임스탬프'] ? new Date(s['타임스탬프']).toLocaleString('ko-KR') : '';
          var tr = document.createElement('tr');
          tr.innerHTML = '<td>' + esc(ts) + '</td>' +
            ['구분', '자격/과정명', '성명', '생년월일', '연락처', '이메일', '우편주소', '입금자명', '입금일자', '비고']
              .map(function (k) { return '<td>' + esc(s[k]) + '</td>'; }).join('');
          tbody.appendChild(tr);
        });
      })
      .catch(function () {});
  }

  document.getElementById('refresh-btn').addEventListener('click', load);
  load();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>관리자 페이지</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css" />
<style>
  :root {
    --bg: #F3F1EA; --card: #FFFFFF; --ink: #1C1B16; --ink-soft: #5C5A50; --ink-faint: #8E8B7D;
    --line: #E4E0D2; --line-strong: #C7C2AE; --accent: #1E4E52; --accent-hover: #163B3E;
    --accent-ink: #123336; --accent-bg: #DEEAE7; --warn-bg: #F7E9D8; --warn-ink: #855416;
    --danger-ink: #A23B2E; --danger-bg: #FBEAE5;
    --shadow-card: 0 1px 2px rgba(28,27,22,0.05), 0 16px 32px -18px rgba(28,27,22,0.28);
    --shadow-soft: 0 1px 2px rgba(28,27,22,0.05); --radius: 10px;
    --font-serif: Georgia, "Iowan Old Style", "Nanum Myeongjo", serif;
    --font-sans: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    --font-mono: "SFMono-Regular", Consolas, "Nanum Gothic Coding", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171815; --card: #212220; --ink: #F1EEE4; --ink-soft: #B2AE9E; --ink-faint: #7A7669;
      --line: #34352F; --line-strong: #47483F; --accent: #79BAB9; --accent-hover: #91CBCA;
      --accent-ink: #CFEBEA; --accent-bg: #223533; --warn-bg: #34291A; --warn-ink: #E7B876;
      --danger-ink: #E68B7C; --danger-bg: #3A241F;
      --shadow-card: 0 1px 2px rgba(0,0,0,0.3), 0 16px 32px -18px rgba(0,0,0,0.55);
      --shadow-soft: 0 1px 2px rgba(0,0,0,0.3);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); padding: 48px 20px 64px; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 880px; margin: 0 auto; font-family: var(--font-sans); color: var(--ink); }
  .wrap.narrow { max-width: 420px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; letter-spacing: .06em;
    color: var(--accent-ink); background: var(--accent-bg); padding: 5px 12px 5px 10px; border-radius: 100px; font-weight: 600; }
  h1 { font-family: var(--font-serif); font-size: 26px; font-weight: 400; margin: 16px 0 8px; }
  h2 { font-family: var(--font-serif); font-size: 19px; font-weight: 400; margin: 0 0 14px; }
  .lead { font-size: 14.5px; line-height: 1.65; color: var(--ink-soft); margin: 0 0 4px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 26px 28px; box-shadow: var(--shadow-card); }
  .card + .card { margin-top: 20px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 7px; }
  input[type="text"], input[type="password"], select {
    width: 100%; font-family: var(--font-sans); font-size: 14.5px; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line-strong); border-radius: 8px; padding: 11px 12px; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3.5px var(--accent-bg); }
  .row3 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) minmax(0,1fr); gap: 12px; margin-bottom: 14px; }
  .field { margin-bottom: 14px; }
  button.btn { padding: 11px 18px; border-radius: 8px; border: none; background: var(--accent); color: var(--card);
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  button.btn:hover { background: var(--accent-hover); }
  button.btn:disabled { opacity: .6; cursor: default; }
  .msg { font-size: 12.5px; margin-top: 10px; display: none; }
  .msg.ok { color: var(--accent-ink); } .msg.err { color: var(--danger-ink); }

  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
  th, td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; }
  th { background: var(--accent-bg); color: var(--accent-ink); font-weight: 600; position: sticky; top: 0; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--bg); }
  .empty-state { padding: 30px; text-align: center; color: var(--ink-faint); font-size: 13.5px; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .toolbar select { max-width: 220px; }
  .count-pill { font-size: 12px; color: var(--ink-faint); }
  .instructor-list { margin-top: 16px; font-size: 13px; }
  .instructor-list table th, .instructor-list table td { font-size: 12.5px; }
</style>
</head>
<body>

<div class="wrap narrow" id="gate">
  <span class="eyebrow"><i class="ti ti-lock" aria-hidden="true"></i>한국영유아AI교육진흥협회</span>
  <h1>관리자 페이지</h1>
  <p class="lead">강사님과 운영진만 접속하는 화면입니다. 비밀번호를 입력해주세요.</p>
  <div class="card">
    <div class="field">
      <label>비밀번호</label>
      <input type="password" id="pw-input" placeholder="비밀번호" />
    </div>
    <button class="btn" id="pw-submit" style="width:100%;"><i class="ti ti-login-2" aria-hidden="true"></i> 입장</button>
    <p class="msg err" id="pw-err">비밀번호가 올바르지 않습니다.</p>
  </div>
</div>

<div class="wrap" id="main" style="display:none;">
  <span class="eyebrow"><i class="ti ti-lock-open" aria-hidden="true"></i>한국영유아AI교육진흥협회</span>
  <h1>관리자 페이지</h1>
  <p class="lead">수강생 자격증 신청 현황과 강사 계좌 정보를 관리합니다.</p>

  <div class="card">
    <h2>강사 계좌 등록/수정</h2>
    <div class="row3">
      <div class="field" style="margin-bottom:0;">
        <label>강사명</label>
        <input type="text" id="acc-name" placeholder="홍길동" />
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>은행</label>
        <input type="text" id="acc-bank" placeholder="카카오뱅크" />
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>예금주</label>
        <input type="text" id="acc-holder" placeholder="홍길동" />
      </div>
    </div>
    <div class="field">
      <label>계좌번호</label>
      <input type="text" id="acc-number" placeholder="0000000000000" />
    </div>
    <button class="btn" id="acc-save"><i class="ti ti-device-floppy" aria-hidden="true"></i> 저장</button>
    <p class="msg ok" id="acc-msg-ok">저장되었습니다.</p>
    <p class="msg err" id="acc-msg-err">저장에 실패했습니다.</p>

    <div class="instructor-list">
      <div class="table-wrap">
        <table>
          <thead><tr><th>강사명</th><th>은행</th><th>계좌번호</th><th>예금주</th><th>수강생 신청 링크</th><th></th></tr></thead>
          <tbody id="instructor-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>수강생 자격증 신청 현황</h2>
    <div class="toolbar">
      <select id="filter-teacher"><option value="">전체 강사</option></select>
      <span class="count-pill" id="count-pill"></span>
      <button class="btn" id="refresh-btn" style="margin-left:auto;"><i class="ti ti-refresh" aria-hidden="true"></i> 새로고침</button>
    </div>
    <div class="table-wrap">
      <table id="students-table">
        <thead>
          <tr>
            <th>접수일시</th><th>구분</th><th>자격/과정명</th><th>성명</th><th>생년월일</th>
            <th>연락처</th><th>이메일</th><th>우편주소</th><th>담당 강사</th><th>입금자명</th><th>비고</th>
          </tr>
        </thead>
        <tbody id="students-table-body"></tbody>
      </table>
      <div class="empty-state" id="students-empty" style="display:none;">아직 신청 내역이 없습니다.</div>
    </div>
  </div>
</div>

<script>
  var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbxxrpIbAuO2mGIKrgakBOgExkeNhEKo3V601xnOcFlDU3cdjP2Y_Pd6MTXgIFe8Dcfz/exec';
  var APPLY_BASE_URL = 'https://tweetyseoul1.github.io/level2-training-report/apply.html';
  var currentPw = sessionStorage.getItem('admin_pw') || '';
  var allStudents = [];
  var allInstructors = [];

  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

  function fallbackCopyLink(text, done) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta); done();
  }

  function loadAdminData(pw) {
    return fetch(WEBAPP_URL + '?action=admin&pw=' + encodeURIComponent(pw))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data || data.ok !== true) throw new Error('unauthorized');
        allStudents = data.students || [];
        allInstructors = data.instructors || [];
        return true;
      });
  }

  function renderInstructors() {
    var tbody = document.getElementById('instructor-table-body');
    tbody.innerHTML = '';
    allInstructors.forEach(function (t) {
      var link = APPLY_BASE_URL + '?teacher=' + encodeURIComponent(t.name);
      var tr = document.createElement('tr');
      tr.innerHTML = '<td>' + esc(t.name) + '</td><td>' + esc(t.bank) + '</td><td>' + esc(t.account) + '</td><td>' + esc(t.holder) +
        '</td><td><button class="btn" style="padding:5px 10px;font-size:12px;" data-copy-link="' + esc(t.name) + '"><i class="ti ti-link" aria-hidden="true"></i> 링크 복사</button></td>' +
        '<td><button class="btn" style="padding:5px 10px;font-size:12px;" data-edit="' + esc(t.name) + '">수정</button></td>';
      tbody.appendChild(tr);
    });
    tbody.querySelectorAll('[data-edit]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var t = allInstructors.filter(function (x) { return x.name === btn.getAttribute('data-edit'); })[0];
        if (!t) return;
        document.getElementById('acc-name').value = t.name;
        document.getElementById('acc-bank').value = t.bank;
        document.getElementById('acc-number').value = t.account;
        document.getElementById('acc-holder').value = t.holder;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
    tbody.querySelectorAll('[data-copy-link]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var name = btn.getAttribute('data-copy-link');
        var link = APPLY_BASE_URL + '?teacher=' + encodeURIComponent(name);
        function marked() {
          var orig = btn.innerHTML;
          btn.innerHTML = '<i class="ti ti-check" aria-hidden="true"></i> 복사됨';
          setTimeout(function () { btn.innerHTML = orig; }, 1800);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(link).then(marked, function () { fallbackCopyLink(link, marked); });
        } else { fallbackCopyLink(link, marked); }
      });
    });

    var filterSelect = document.getElementById('filter-teacher');
    var current = filterSelect.value;
    filterSelect.innerHTML = '<option value="">전체 강사</option>';
    allInstructors.forEach(function (t) {
      var opt = document.createElement('option');
      opt.value = t.name; opt.textContent = t.name;
      filterSelect.appendChild(opt);
    });
    filterSelect.value = current;
  }

  function renderStudents() {
    var filter = document.getElementById('filter-teacher').value;
    var rows = allStudents.filter(function (s) { return !filter || s['담당 강사'] === filter; });
    var tbody = document.getElementById('students-table-body');
    tbody.innerHTML = '';
    document.getElementById('students-empty').style.display = rows.length ? 'none' : 'block';
    document.getElementById('count-pill').textContent = rows.length + '건';
    rows.slice().reverse().forEach(function (s) {
      var tr = document.createElement('tr');
      var ts = s['타임스탬프'] ? new Date(s['타임스탬프']).toLocaleString('ko-KR') : '';
      tr.innerHTML = ['타임스탬프_fmt', '구분', '자격/과정명', '성명', '생년월일', '연락처', '이메일', '우편주소', '담당 강사', '입금자명', '비고']
        .map(function (k) { return '<td>' + esc(k === '타임스탬프_fmt' ? ts : s[k]) + '</td>'; }).join('');
      tbody.appendChild(tr);
    });
  }

  document.getElementById('filter-teacher').addEventListener('change', renderStudents);

  document.getElementById('refresh-btn').addEventListener('click', function () {
    loadAdminData(currentPw).then(function () { renderInstructors(); renderStudents(); });
  });

  document.getElementById('acc-save').addEventListener('click', function () {
    var name = document.getElementById('acc-name').value.trim();
    var bank = document.getElementById('acc-bank').value.trim();
    var account = document.getElementById('acc-number').value.trim();
    var holder = document.getElementById('acc-holder').value.trim();
    var okMsg = document.getElementById('acc-msg-ok'), errMsg = document.getElementById('acc-msg-err');
    okMsg.style.display = 'none'; errMsg.style.display = 'none';
    if (!name || !bank || !account || !holder) { errMsg.textContent = '모든 항목을 입력해주세요.'; errMsg.style.display = 'block'; return; }
    fetch(WEBAPP_URL, {
      method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ formType: 'setInstructorAccount', pw: currentPw, teacherName: name, bank: bank, account: account, holder: holder })
    }).then(function () {
      okMsg.style.display = 'block';
      document.getElementById('acc-name').value = ''; document.getElementById('acc-bank').value = '';
      document.getElementById('acc-number').value = ''; document.getElementById('acc-holder').value = '';
      return loadAdminData(currentPw);
    }).then(function () { renderInstructors(); renderStudents(); })
      .catch(function () { errMsg.style.display = 'block'; });
  });

  function tryLogin(pw) {
    var errEl = document.getElementById('pw-err');
    errEl.style.display = 'none';
    loadAdminData(pw).then(function () {
      currentPw = pw;
      sessionStorage.setItem('admin_pw', pw);
      document.getElementById('gate').style.display = 'none';
      document.getElementById('main').style.display = 'block';
      renderInstructors(); renderStudents();
    }).catch(function () {
      errEl.style.display = 'block';
    });
  }

  document.getElementById('pw-submit').addEventListener('click', function () {
    tryLogin(document.getElementById('pw-input').value.trim());
  });
  document.getElementById('pw-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') tryLogin(document.getElementById('pw-input').value.trim());
  });

  if (currentPw) tryLogin(currentPw);
</script>
</body>
</html>
